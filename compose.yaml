name: customer-importer

services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - composer_vendor:/app/vendor
      - node_modules:/app/node_modules
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: "5432"
      DB_DATABASE: customer_importer
      DB_USERNAME: customer_importer
      DB_PASSWORD: customer_importer
    depends_on:
      database:
        condition: service_healthy
    init: true
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: customer_importer
      POSTGRES_USER: customer_importer
      POSTGRES_PASSWORD: customer_importer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_importer -d customer_importer"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  composer_vendor:
  node_modules:
  postgres_data:
